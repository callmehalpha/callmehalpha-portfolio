# Local development: copy to docker-compose.override.yml.
# Every email the backend sends lands in Mailpit: http://localhost:8025
services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
  backend:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      WATCH_POLL_INTERVAL_MS: 1000
    depends_on:
      mailpit:
        condition: service_started
