name: content-engine

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?set CONTENT_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d content && pg_isready -U postgres -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    # Must own ./inbox on the host (the watcher moves files to processed/ and failed/).
    user: "${CONTENT_UID:-1000}:${CONTENT_GID:-1000}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://content:${CONTENT_DB_PASSWORD}@postgres:5432/content
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      APPROVAL_LINK_SECRET: ${APPROVAL_LINK_SECRET:?set APPROVAL_LINK_SECRET}
      N8N_WEBHOOK_BASE: http://n8n:5678/webhook
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?set N8N_WEBHOOK_SECRET}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      INBOX_DIR: /data/inbox
      PERSONA_DIR: /data/persona
      STORAGE_DIR: /data/storage
      WATCH_POLL_INTERVAL_MS: ${WATCH_POLL_INTERVAL_MS:-5000}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
    volumes:
      - ./inbox:/data/inbox
      - ./persona:/data/persona:ro
      - storage:/data/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.42.7}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      GENERIC_TIMEZONE: ${TZ:-Africa/Lagos}
      N8N_RUNNERS_ENABLED: "true"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Workflows call the backend with these.
      CONTENT_API_URL: http://backend:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["production"]
    depends_on: [backend, n8n]
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      N8N_DOMAIN: ${N8N_DOMAIN:-n8n.localhost}
      N8N_EDITOR_USER: ${N8N_EDITOR_USER:-admin}
      N8N_EDITOR_PASSWORD_HASH: ${N8N_EDITOR_PASSWORD_HASH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  n8n_data:
  storage:
  caddy_data:
